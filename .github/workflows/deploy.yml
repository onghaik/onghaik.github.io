name: Deploy Haunt Site to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

# Grants the workflow permission to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensures only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Guile and Haunt
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0 haunt guile-commonmark guile-reader

      - name: Build site with Haunt
        run: haunt build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site # Change this if you set a custom #:build-directory in haunt.scm

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
